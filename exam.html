<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамен по 42 хадисам — Ильмкала</title>
    <meta name="description" content="Экзамен по сборнику 42 хадисов имама ан-Навави: 30 вопросов о хадисах, передатчиках и смыслах, оценка по пятибалльной шкале.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oranienbaum&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #efeae1;
            --card: #fbf9f4;
            --text: #22304a;
            --text-soft: #6d7482;
            --blue: #2b4470;
            --silver: #8b9099;
            --gold: #b89a5e;
            --line: #ddd6c8;
            --green: #3e7d5a;
            --red: #a05c3b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Oranienbaum', 'Times New Roman', serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header { padding: 2.2rem 1rem 1.4rem; text-align: center; }
        .arabic-line { font-size: 1.2rem; color: var(--gold); margin-bottom: 0.4rem; }
        h1 {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            letter-spacing: 0.15em;
            color: var(--blue);
            font-weight: 400;
        }
        .ornament { display: flex; align-items: center; gap: 12px; max-width: 240px; margin: 1.1rem auto 0; }
        .ornament::before, .ornament::after { content: ''; flex: 1; height: 1px; background: var(--silver); }
        .ornament span { width: 8px; height: 8px; background: var(--gold); transform: rotate(45deg); }
        .container { max-width: 660px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
        .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 1.6rem; }
        .bar-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.4s ease; }
        .counter { text-align: center; color: var(--text-soft); font-size: 0.95rem; letter-spacing: 0.1em; margin-bottom: 0.8rem; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-top: 3px solid var(--blue);
            border-radius: 4px;
            padding: 1.8rem 1.6rem;
        }
        .question { font-size: 1.3rem; line-height: 1.45; margin: 0 0 1.4rem; }
        .option {
            display: block;
            width: 100%;
            text-align: left;
            font-family: inherit;
            font-size: 1.05rem;
            padding: 0.75rem 1rem;
            margin-bottom: 0.6rem;
            background: #ffffff;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--text);
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .option:hover { border-color: var(--silver); }
        .option.correct { background: rgba(62, 125, 90, 0.12); border-color: var(--green); color: var(--green); }
        .option.wrong { background: rgba(160, 92, 59, 0.10); border-color: var(--red); color: var(--red); }
        .option:disabled { cursor: default; }
        #result { display: none; text-align: center; }
        .score-line { font-size: 1.15rem; color: var(--text-soft); margin-bottom: 0.6rem; }
        .grade { font-size: 4.5rem; color: var(--gold); line-height: 1; margin: 0.6rem 0; }
        .verdict { font-size: 1.5rem; color: var(--blue); margin: 0.4rem 0 1rem; }
        .comment { color: var(--text-soft); max-width: 480px; margin: 0 auto 1.8rem; line-height: 1.5; }
        .btn-row { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            font-family: inherit;
            font-size: 1.05rem;
            padding: 0.75rem 1.8rem;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.92; }
        .btn-gold { background: var(--gold); color: #ffffff; border: 1px solid var(--gold); }
        .btn-blue { background: transparent; color: var(--blue); border: 1px solid var(--blue); }
        footer { margin-top: auto; text-align: center; padding: 1.4rem; color: var(--text-soft); font-size: 0.85rem; border-top: 1px solid var(--line); }
    </style>
</head>
<body>

    <header>
        <div class="arabic-line" lang="ar" dir="rtl">طَرِيقُ الْعِلْمِ</div>
        <h1>Экзамен · 42 хадиса</h1>
        <div class="ornament"><span></span></div>
    </header>

    <div class="container">

        <div id="quiz">
            <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
            <div class="counter" id="counter"></div>
            <div class="card">
                <p class="question" id="question"></p>
                <div id="options"></div>
            </div>
        </div>

        <div id="result">
            <div class="score-line" id="score-line"></div>
            <div class="grade" id="grade"></div>
            <div class="verdict" id="verdict"></div>
            <p class="comment" id="comment"></p>
            <div class="btn-row">
                <button class="btn btn-gold" onclick="location.reload()">Начать заново</button>
                <a class="btn btn-blue" href="index.html">Вернуться на главную</a>
            </div>
        </div>

    </div>

    <footer>Ильмкала — крепость знания</footer>

    <script>
        // ============================================
        //  ЭКЗАМЕН ПО СБОРНИКУ 42 ХАДИСОВ ИМАМА АН-НАВАВИ
        //  15 хадисов: №1, 2, 3, 5, 6, 12, 13, 15, 16,
        //  17, 18, 20, 27, 31, 34 (нумерация сборника).
        //  30 вопросов: о содержании, о передатчиках,
        //  о названиях хадисов.
        //  answer — номер верного варианта (счёт с нуля).
        // ============================================
        const QUESTIONS = [
            // --- О содержании хадиса №1 ---
            {
                q: 'О чём главный смысл хадиса «Дела — по намерениям»?',
                options: ['Каждое дело оценивается по тому, ради чего человек его совершил', 'Все люди получают одинаковую награду', 'Намерение может заменить само дело'],
                answer: 0
            },
            // --- О передатчике хадиса №5 ---
            {
                q: 'Кто передал хадис об отвержении нововведений?',
                options: ['Аиша, да будет доволен ею Аллах', 'Хафса, да будет доволен ею Аллах', 'Умм Саляма, да будет доволен ею Аллах'],
                answer: 0
            },
            // --- О названии хадиса №12 ---
            {
                q: 'Как называется хадис, в котором сказано, что частью совершенства ислама является оставление того, что не касается человека?',
                options: ['«Оставление того, что не касается»', '«Богобоязненность и благонравие»', '«Стыдливость»'],
                answer: 0
            },
            // --- О содержании хадиса №1 (хиджра) ---
            {
                q: 'В хадисе о намерениях сказано, что хиджра будет принята, только если она совершена…',
                options: ['ради Аллаха и Его Посланника', 'ради переезда в большой город', 'ради торговли'],
                answer: 0
            },
            // --- О содержании хадиса №2 ---
            {
                q: 'Чему посвящён хадис Джибриля?',
                options: ['Правилам торговли и наследства', 'Исламу, иману, ихсану и признакам Судного дня', 'Правилам сна и питания'],
                answer: 1
            },
            // --- О передатчике хадиса №13 ---
            {
                q: 'Кто передал хадис о том, что вера не станет полной, пока человек не полюбит брату то же, что себе?',
                options: ['Абу Хурайра', 'Анас ибн Малик', 'Абдуллах ибн Аббас'],
                answer: 1
            },
            // --- О названии хадиса №6 ---
            {
                q: 'Как называется хадис, начинающийся словами «Поистине, дозволенное ясно и запретное ясно»?',
                options: ['«О намерениях»', '«О столпах ислама»', '«Дозволенное и запретное»'],
                answer: 2
            },
            // --- О содержании хадиса №2 (иман) ---
            {
                q: 'Сколько основ имана названо в хадисе Джибриля?',
                options: ['Пять', 'Шесть', 'Четыре'],
                answer: 1
            },
            // --- О содержании хадиса №3 ---
            {
                q: 'На скольких основах воздвигнут ислам по хадису?',
                options: ['На трёх', 'На пяти', 'На семи'],
                answer: 1
            },
            // --- О передатчике хадиса №17 ---
            {
                q: 'Кто передал хадис «Поистине, Аллах предписал ихсан во всём»?',
                options: ['Убада ибн ас-Самит', 'Абу Зарр', 'Шаддад ибн Аус'],
                answer: 2
            },
            // --- О названии хадиса №16 ---
            {
                q: 'Как называется хадис, в котором Пророк ﷺ повторил один и тот же совет трижды?',
                options: ['«Воздержанность и её плоды»', '«Не гневайся»', '«Совершенство во всём»'],
                answer: 1
            },
            // --- О содержании хадиса №6 (сердце) ---
            {
                q: 'Какой орган, по хадису, делает хорошим всё тело, если он хорош?',
                options: ['Язык', 'Сердце', 'Глаза'],
                answer: 1
            },
            // --- О содержании хадиса №5 ---
            {
                q: 'Что произойдёт с делом, которое не согласуется с нашей религией?',
                options: ['Оно будет принято, если его совершают многие', 'Оно будет отвергнуто', 'Оно учитывается только в мирских делах'],
                answer: 1
            },
            // --- О передатчике хадиса №18 ---
            {
                q: 'Кто передал хадис «Бойся Аллаха, где бы ты ни был»?',
                options: ['Абу Хурайра и Абдуллах ибн Умар', 'Анас ибн Малик и Джабир', 'Абу Зарр и Муаз ибн Джабаль'],
                answer: 2
            },
            // --- О названии хадиса №20 ---
            {
                q: 'Как называется хадис о том, что стыдливость является ветвью веры?',
                options: ['«Очищение — половина веры»', '«Говори благое или молчи»', '«Стыдливость — часть веры»'],
                answer: 2
            },
            // --- О содержании хадиса №16 (три раза) ---
            {
                q: 'Сколько раз человек просил Пророка ﷺ о наставлении в хадисе «Не гневайся»?',
                options: ['Один раз', 'Семь раз', 'Три раза'],
                answer: 2
            },
            // --- О содержании хадиса №6 (категории дел) ---
            {
                q: 'Какие три категории дел названы в хадисе о дозволенном и запретном?',
                options: ['Обязательное, желательное и нежелательное', 'Дозволенное ясное, запретное ясное и сомнительное', 'Истинное, ложное и спорное'],
                answer: 1
            },
            // --- О передатчике хадиса №34 ---
            {
                q: 'Кто передал хадис об изменении порицаемого?',
                options: ['Сахль ибн Саад', 'Абу Саид аль-Худри', 'Умар ибн аль-Хаттаб'],
                answer: 1
            },
            // --- О названии хадиса №31 ---
            {
                q: 'Как называется хадис, начинающийся словами «Отрекись от мира этого — и полюбит тебя Аллах»?',
                options: ['«Отвержение нововведений»', '«Благочестие и грех»', '«Воздержанность и её плоды»'],
                answer: 2
            },
            // --- О содержании хадиса №31 (что такое зухд) ---
            {
                q: 'Что означает зухд (воздержанность) по хадису №31?',
                options: ['Полный отказ от дозволенного и уход из мира', 'Равнодушие сердца к мирскому — без отказа от дозволенного заработка', 'Накопление имущества ради раздачи'],
                answer: 1
            },
            // --- О содержании хадиса №12 ---
            {
                q: 'Что является частью совершенства ислама человека?',
                options: ['Пост в Рамадан', 'Милостыня', 'Оставление того, что его не касается'],
                answer: 2
            },
            // --- О содержании хадиса №13 ---
            {
                q: 'Когда, по хадису, не станет веровать один из вас?',
                options: ['Пока не совершит хадж', 'Пока не полюбит брату то же, что желает себе', 'Пока не выучит Коран наизусть'],
                answer: 1
            },
            // --- О содержании хадиса №15 ---
            {
                q: 'Что должен делать тот, кто верует в Аллаха и Последний день?',
                options: ['Говорить только на арабском', 'Говорить благое или молчать', 'Обещать благое, не выполняя'],
                answer: 1
            },
            // --- О содержании хадиса №16 ---
            {
                q: 'Человек трижды просил у Пророка ﷺ наставление. Что Пророк ﷺ отвечал каждый раз?',
                options: ['«Совершай намаз»', '«Не гневайся»', '«Читай Коран»'],
                answer: 1
            },
            // --- О содержании хадиса №17 ---
            {
                q: 'Что означает ихсан во всём по хадису Шаддада ибн Ауса?',
                options: ['Даже при закалывании животного нужно поступать хорошо и хорошо наточить нож', 'Ихсан относится только к намазу', 'Ихсан — это поститься каждый понедельник'],
                answer: 0
            },
            // --- О содержании хадиса №18 ---
            {
                q: 'Из каких наставлений состоит хадис Абу Зарра и Муаза?',
                options: ['Бойся Аллаха, где бы ты ни был; следуй за дурным делом добрым — оно сотрёт его; относись к людям с хорошим нравом', 'Постись, давай милостыню и совершай хадж', 'Не гневайся, говори благое и будь стыдливым'],
                answer: 0
            },
            // --- О содержании хадиса №20 ---
            {
                q: 'Стыдливость является ветвью…',
                options: ['знания', 'терпения', 'веры'],
                answer: 2
            },
            // --- О содержании хадиса №27 ---
            {
                q: 'Что такое праведность (бирр) по хадису ан-Навваса ибн Самана?',
                options: ['Совершение ночных намазов', 'Благонравие', 'Обучение Корану'],
                answer: 1
            },
            // --- О содержании хадиса №31 (ответ Пророка) ---
            {
                q: 'Что ответил Пророк ﷺ человеку, спросившему, как обрести любовь Аллаха и людей?',
                options: ['Раздай всё имущество нищим', 'Проявляй воздержанность к мирскому — полюбит тебя Аллах; не стремись к тому, что есть у людей, — полюбят тебя люди', 'Живи уединённо, вдали от людей'],
                answer: 1
            },
            // --- О содержании хадиса №34 ---
            {
                q: 'Каковы три степени изменения порицаемого?',
                options: ['Молча, тайно и явно', 'Словом, имуществом и силой', 'Рукой, языком и сердцем'],
                answer: 2
            }
        ];

        const TOTAL = QUESTIONS.length;
        let current = 0;
        let score = 0;
        let answered = false;

        const counterEl = document.getElementById('counter');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const barEl = document.getElementById('bar-fill');
        const quizEl = document.getElementById('quiz');
        const resultEl = document.getElementById('result');

        function renderQuestion() {
            answered = false;
            counterEl.textContent = 'Вопрос ' + (current + 1) + ' из ' + TOTAL;
            barEl.style.width = Math.round(current / TOTAL * 100) + '%';

            const item = QUESTIONS[current];
            questionEl.textContent = item.q;

            let html = '';
            for (let i = 0; i < item.options.length; i++) {
                html += '<button class="option" onclick="chooseAnswer(' + i + ')">' + item.options[i] + '</button>';
            }
            optionsEl.innerHTML = html;
        }

        function chooseAnswer(index) {
            if (answered) return;
            answered = true;

            const item = QUESTIONS[current];
            const buttons = optionsEl.querySelectorAll('.option');

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === item.answer) {
                    buttons[i].classList.add('correct');
                }
            }
            if (index === item.answer) {
                score++;
            } else {
                buttons[index].classList.add('wrong');
            }

            setTimeout(function () {
                current++;
                if (current < TOTAL) {
                    renderQuestion();
                } else {
                    showResult();
                }
            }, 1000);
        }

        function showResult() {
            quizEl.style.display = 'none';
            barEl.style.width = '100%';

            // Шкала: 27–30 → «5», 22–26 → «4», 18–21 → «3», меньше 18 → «2»
            let grade;
            if (score >= 27) {
                grade = 5;
            } else if (score >= 22) {
                grade = 4;
            } else if (score >= 18) {
                grade = 3;
            } else {
                grade = 2;
            }

            const passed = grade >= 3;

            document.getElementById('score-line').textContent = 'Правильных ответов: ' + score + ' из ' + TOTAL;
            document.getElementById('grade').textContent = grade;
            document.getElementById('verdict').textContent = passed ? 'Вы успешно сдали экзамен!' : 'Экзамен не сдан';
            document.getElementById('comment').textContent =
                grade === 5 ? 'Превосходно! Вы отлично знаете сборник имама ан-Навави.' :
                grade === 4 ? 'Очень хороший результат. Осталось совсем немного до совершенства.' :
                grade === 3 ? 'Хороший результат, но повторите хадисы, которые вызвали затруднения.' :
                'Не огорчайтесь. Повторите хадисы и попробуйте снова.';

            resultEl.style.display = 'block';
        }

        renderQuestion();
    </script>
</body>
</html>
