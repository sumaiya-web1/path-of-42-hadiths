<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Path of 42 Hadiths</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="arabic-banner">بسم الله الرحمن الرحيم</div>

    <header>
        <h1>The Path of 42 Hadiths</h1>
        <p class="subtitle">Собрание достоверных хадисов Имама ан-Навави</p>
    </header>

    <div class="controls">
        <input type="text" id="search" placeholder="Поиск по хадисам...">

        <div class="mode-switch">
            <button id="mode-read" class="active">Режим чтения</button>
            <button id="mode-memorize">Режим заучивания</button>
        </div>

        <div class="progress-wrap">
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <span id="progress-text">Выучено: 0 из 42</span>
        </div>
    </div>

    <div class="hadith-list" id="hadiths"></div>

    <footer>
        <p>«42 хадиса» Имама ан-Навави</p>
        <p>Заучивание с сохранением прогресса и экзаменом</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
