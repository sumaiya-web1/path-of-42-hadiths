<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ильмкала — крепость знания</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Спокойные, читаемые шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/adhan@4.4.2/dist/adhan.umd.min.js"></script>
    <style>
        :root {
            --bg: #f5f6f9;
            --card: #ffffff;
            --text: #2c3e50;
            --accent: #2b4470;
            --gold: #b89a5e;
            --line: #e0e0e0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Merriweather', serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        header {
            padding: 3rem 1rem;
            text-align: center;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--accent);
            margin: 0 0 0.5rem;
            letter-spacing: -1px;
        }
        .subtitle {
            color: var(--gold);
            font-size: 1.1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem 3rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;

</html>
